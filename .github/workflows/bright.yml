name: Bright

on:
  pull_request:
    branches:
      - '**'

permissions:
  checks: write
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: |
          docker login --username=${{ vars.DOCKERHUB_BRIGHT_USER }} --password=${{ secrets.DOCKERHUB_BRIGHT_TOKEN }}

      - name: Generate timestamp
        id: timestamp
        run: echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Generate short SHA
        id: sha
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-6)" >> $GITHUB_ENV

      - name: Set tag prefix
        id: set_tag_prefix
        run: |
          TAG_PREFIX="unstable"
          echo "TAG_PREFIX=${TAG_PREFIX}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t brightsec/brokencrystals:${{ env.TAG_PREFIX }} .
          docker tag brightsec/brokencrystals:${{ env.TAG_PREFIX }} brightsec/brokencrystals:${{ env.TAG_PREFIX }}-${{ env.SHORT_SHA }}
          docker tag brightsec/brokencrystals:${{ env.TAG_PREFIX }} brightsec/brokencrystals:${{ env.TAG_PREFIX }}-${{ env.SHORT_SHA }}-${{ env.TIMESTAMP }}

      - name: Push Docker images
        run: |
          docker push brightsec/brokencrystals:${{ env.TAG_PREFIX }}
          docker push brightsec/brokencrystals:${{ env.TAG_PREFIX }}-${{ env.SHORT_SHA }}
          docker push brightsec/brokencrystals:${{ env.TAG_PREFIX }}-${{ env.SHORT_SHA }}-${{ env.TIMESTAMP }}

      - name: Start application
        env:
          POSTGRES_DB: bc
          POSTGRES_PASSWORD: bc
          POSTGRES_USER: bc
          URL: http://localhost:3000
        run: |
          docker compose -f compose.local.yml up --wait

      - name: Probe application readiness
        run: |
          for i in {1..30}; do nc -z 127.0.0.1 3000 && exit 0 || sleep 5; done; exit 1

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install SecTesterJS dependencies
        run: |
          npm i --save=false --prefix .brightsec @sectester/core@0.47.0 @sectester/repeater@0.47.0 @sectester/scan@0.47.0 @sectester/runner@0.47.0 @sectester/reporter@0.47.0

      - name: Configure Bright credentials
        uses: ./.github/workflows/composite/configure-bright-credentials
        with:
          BRIGHT_HOSTNAME: app.brightsec.com
          BRIGHT_PROJECT_ID: 9YKVqiT7C9oEYNG1t22Fvd
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}

      - name: Run security tests
        env:
          BRIGHT_HOSTNAME: app.brightsec.com
          BRIGHT_PROJECT_ID: 9YKVqiT7C9oEYNG1t22Fvd
          BRIGHT_AUTH_ID: ${{ vars.BRIGHT_AUTH_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ env.BRIGHT_TOKEN }}
          BRIGHT_TARGET_URL: http://127.0.0.1:3000
          SECTESTER_SCAN_POOL_SIZE: ${{ vars.SECTESTER_SCAN_POOL_SIZE }}
        run: |
          node --experimental-transform-types --experimental-strip-types --experimental-detect-module --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --disable-warning=ExperimentalWarning --test-force-exit --test-concurrency=4 --test .brightsec/tests/*.test.ts